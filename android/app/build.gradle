plugins {
    id "com.android.application"
}

// Optional workaround for managed Windows workspaces where Gradle's Javac
// worker cannot resolve the SDK JAR through its sandboxed ZipFileSystem.
if (project.hasProperty("sandboxJavacWorkaround")) {
    def sandboxClasses = layout.buildDirectory.dir("intermediates/javac/debug/compileDebugJavaWithJavac/classes")
    tasks.register("sandboxJavacWorkaround") {
        outputs.dir(sandboxClasses)
        doLast {
            def outputDir = sandboxClasses.get().asFile
            outputDir.mkdirs()
            def sdkRoot = System.getenv("ANDROID_HOME") ?: System.getenv("ANDROID_SDK_ROOT")
            def javaHome = System.getenv("JAVA_HOME")
            def sourceFiles = fileTree("src/main/java").matching { include("**/*.java") }.files.sort()
            if (!sdkRoot || !javaHome || sourceFiles.isEmpty()) throw new GradleException("Set ANDROID_HOME and JAVA_HOME before using sandboxJavacWorkaround.")
            exec {
                commandLine new File(javaHome, "bin/javac.exe").absolutePath,
                        "-source", "8", "-target", "8",
                        "-cp", new File(sdkRoot, "platforms/android-36/android.jar").absolutePath,
                        "-d", outputDir.absolutePath
                args sourceFiles.collect { it.absolutePath }
            }
        }
    }
    tasks.configureEach {
        if (name == "compileDebugJavaWithJavac") enabled = false
    }
    tasks.named("preBuild") { dependsOn("sandboxJavacWorkaround") }
}

android {
    namespace "com.semestersathi.app"
    compileSdk 36

    defaultConfig {
        applicationId "com.semestersathi.app"
        minSdk 24
        targetSdk 35
        versionCode 6
        versionName "0.1.5"
    }

    // Use the same local test key for personal APK updates when it is present.
    // A fresh source checkout falls back to Android's normal generated debug key.
    if (file("debug.keystore").exists()) {
        signingConfigs {
            localTest {
                storeFile file("debug.keystore")
                storePassword "android"
                keyAlias "androiddebugkey"
                keyPassword "android"
            }
        }
        buildTypes {
            debug {
                signingConfig signingConfigs.localTest
            }
        }
    }
}
