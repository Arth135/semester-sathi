<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f7f5">
  <title>Semester Sathi — Planner Demo</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f7f5;
      --surface: #ffffff;
      --surface-soft: #f8faf9;
      --ink: #17231d;
      --muted: #64736b;
      --line: #e3eae5;
      --green: #24694f;
      --green-dark: #194c39;
      --green-soft: #e7f3ec;
      --blue: #4779a0;
      --blue-soft: #eaf2f8;
      --amber: #a76522;
      --amber-soft: #fff1df;
      --red: #a94343;
      --red-soft: #fbeaea;
      --shadow: 0 12px 32px rgba(29, 57, 43, .07);
      --radius: 18px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--bg);
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #111a16;
      --surface: #1a2620;
      --surface-soft: #202e27;
      --ink: #e7efe9;
      --muted: #a4b3aa;
      --line: #33443a;
      --green: #4eaa7e;
      --green-dark: #9ad5b5;
      --green-soft: #263e32;
      --blue: #84b5d9;
      --blue-soft: #243644;
      --amber: #e4b16f;
      --amber-soft: #443523;
      --red: #e18b8b;
      --red-soft: #442d2d;
      --shadow: 0 12px 32px rgba(0, 0, 0, .24);
    }
    * { box-sizing: border-box; }
    html { overflow-x: clip; scrollbar-gutter: stable; }
    body { margin: 0; min-width: 320px; min-height: 100vh; overflow-x: clip; background: var(--bg); font-size: 16px; }
    button, input, select, textarea { font: inherit; }
    button { color: inherit; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
      outline: 3px solid rgba(36, 105, 79, .26);
      outline-offset: 2px;
    }
    .app-shell { display: grid; grid-template-columns: 244px minmax(0, 1fr); min-height: 100vh; }
    .sidebar {
      position: sticky; top: 0; display: flex; flex-direction: column; height: 100vh;
      padding: 24px 16px 18px; background: var(--surface); border-right: 1px solid var(--line);
    }
    .brand { display: flex; align-items: center; gap: 11px; padding: 0 10px; margin-bottom: 32px; }
    .brand-mark {
      display: grid; width: 40px; height: 40px; place-items: center; border-radius: 13px;
      background: var(--green); color: #fff; font-size: 19px; font-weight: 750; letter-spacing: -.05em;
    }
    .brand-name { font-size: 16px; font-weight: 750; letter-spacing: -.035em; }
    .brand-subtitle { margin-top: 2px; color: var(--muted); font-size: 12px; }
    .side-label { padding: 0 12px; margin: 0 0 9px; color: #819087; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    .nav-list { display: grid; gap: 5px; }
    .nav-button {
      display: flex; align-items: center; gap: 12px; width: 100%; min-height: 46px; padding: 9px 12px;
      border: 0; border-radius: 12px; background: transparent; text-align: left; color: #59685f;
      font-size: 14px; font-weight: 600; cursor: pointer;
    }
    .nav-button:hover { background: var(--surface-soft); color: var(--ink); }
    .nav-button[aria-current="page"] { background: var(--green-soft); color: var(--green-dark); }
    .nav-glyph { display: grid; width: 23px; height: 23px; place-items: center; color: currentColor; font-size: 17px; line-height: 1; }
    .sidebar-spacer { flex: 1; }
    .local-badge {
      display: flex; align-items: flex-start; gap: 10px; padding: 13px 12px;
      border: 1px solid var(--line); border-radius: 14px; background: var(--surface-soft);
    }
    .local-icon { width: 9px; height: 9px; flex: 0 0 auto; margin-top: 5px; border-radius: 50%; background: #35966c; }
    .local-title { font-size: 13px; font-weight: 700; }
    .local-copy { margin-top: 3px; color: var(--muted); font-size: 12px; line-height: 1.4; }
    .workspace { min-width: 0; }
    .topbar {
      display: flex; align-items: center; justify-content: space-between; gap: 20px;
      min-height: 80px; padding: 15px clamp(22px, 4vw, 54px); background: rgba(255,255,255,.8);
      border-bottom: 1px solid var(--line);
    }
    .topbar-left { display: flex; align-items: center; gap: 12px; }
    .mobile-brand { display: none; }
    .top-caption { color: var(--muted); font-size: 13px; }
    .topbar-actions { display: flex; align-items: center; gap: 10px; }
    .avatar { display: grid; width: 38px; height: 38px; place-items: center; border-radius: 50%; background: #dcece3; color: var(--green-dark); font-size: 13px; font-weight: 700; }
    .main-content { width: min(100%, 1440px); min-width: 0; margin: 0 auto; padding: 30px clamp(22px, 4vw, 54px) 42px; }
    .page-heading { display: flex; align-items: flex-end; justify-content: space-between; gap: 18px; margin-bottom: 24px; }
    .eyebrow { margin: 0 0 7px; color: var(--green); font-size: 12px; font-weight: 750; letter-spacing: .07em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(26px, 3vw, 34px); line-height: 1.15; letter-spacing: -.045em; }
    h2 { margin: 0; font-size: 18px; letter-spacing: -.025em; }
    h3 { margin: 0; font-size: 15px; letter-spacing: -.015em; }
    p { margin: 0; }
    .page-description { margin-top: 8px; color: var(--muted); font-size: 15px; line-height: 1.5; }
    .heading-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 9px; }
    .button {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 42px; padding: 9px 14px;
      border: 1px solid var(--line); border-radius: 11px; background: #fff; color: var(--ink);
      font-size: 14px; font-weight: 650; text-decoration: none; cursor: pointer; transition: transform .15s ease, background .15s ease;
    }
    .button:hover { background: var(--surface-soft); }
    .button:active { transform: translateY(1px); }
    .button-primary { border-color: var(--green); background: var(--green); color: #fff; }
    .button-primary:hover { border-color: var(--green-dark); background: var(--green-dark); color: #fff; }
    .button-quiet { border-color: transparent; background: transparent; color: var(--muted); }
    .button-small { min-height: 35px; padding: 7px 10px; font-size: 13px; }
    .stats-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 15px; margin-bottom: 18px; }
    .stat-card, .panel, .exam-card, .subject-card, .progress-card, .settings-card {
      border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow);
    }
    .stat-card { min-height: 116px; padding: 18px 20px; }
    .stat-label { color: var(--muted); font-size: 13px; font-weight: 600; }
    .stat-value { margin-top: 11px; font-size: 25px; font-weight: 760; letter-spacing: -.04em; }
    .stat-foot { margin-top: 5px; color: var(--muted); font-size: 13px; }
    .dashboard-grid { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(330px, .85fr); gap: 18px; align-items: start; }
    .panel { min-width: 0; padding: 20px; }
    .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 17px; }
    .panel-subtitle { margin-top: 5px; color: var(--muted); font-size: 13px; line-height: 1.45; }
    .month-controls { display: flex; align-items: center; gap: 7px; }
    .month-controls strong { min-width: 142px; text-align: center; font-size: 15px; }
    .month-nav { min-height: 36px; padding: 6px 9px; font-size: 12px; }
    .calendar-weekdays, .calendar-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
    .calendar-weekdays { margin: 0 0 7px; color: #78857d; text-align: center; font-size: 12px; font-weight: 650; }
    .calendar-weekdays span { padding: 7px 0; }
    .calendar-day {
      position: relative; display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
      min-width: 0; min-height: 57px; padding: 8px 3px 6px; border: 1px solid transparent; border-radius: 12px;
      background: transparent; color: var(--ink); font-size: 13px; cursor: pointer;
    }
    .calendar-day:hover { border-color: var(--line); background: var(--surface-soft); }
    .calendar-day[aria-pressed="true"] { border-color: var(--green); background: var(--green); color: #fff; font-weight: 750; }
    .calendar-day.is-other-month { color: #a5aea8; }
    .calendar-day.is-today:not([aria-pressed="true"]) { border-color: #a8cdb8; color: var(--green-dark); font-weight: 750; }
    .day-dots { display: flex; gap: 3px; min-height: 6px; margin-top: 7px; }
    .day-dot { width: 5px; height: 5px; border-radius: 50%; background: #4d9b72; }
    .day-dot.exam { background: #638bb3; }
    .calendar-day[aria-pressed="true"] .day-dot { background: #fff; }
    .calendar-legend { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 14px; color: var(--muted); font-size: 13px; }
    .legend-item { display: inline-flex; align-items: center; gap: 7px; }
    .legend-dot { width: 7px; height: 7px; border-radius: 50%; background: #4d9b72; }
    .legend-dot.exam { background: #638bb3; }
    .agenda-panel { padding: 0; overflow: hidden; }
    .agenda-head { padding: 20px 20px 15px; border-bottom: 1px solid var(--line); }
    .agenda-title-line { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    .agenda-date { color: var(--muted); font-size: 13px; }
    .agenda-list { display: grid; gap: 10px; padding: 15px 17px 18px; }
    .exam-row { display: flex; gap: 12px; padding: 13px; border-radius: 14px; background: var(--blue-soft); }
    .exam-mark { flex: 0 0 auto; width: 4px; border-radius: 999px; background: var(--blue); }
    .exam-info { flex: 1; min-width: 0; }
    .exam-kicker { color: #527899; font-size: 12px; font-weight: 750; letter-spacing: .05em; text-transform: uppercase; }
    .exam-name { margin-top: 3px; font-size: 14px; font-weight: 720; }
    .exam-meta { margin-top: 4px; color: #52697d; font-size: 13px; line-height: 1.4; }
    .task-row {
      display: flex; align-items: flex-start; gap: 11px; padding: 12px 11px; border: 1px solid var(--line);
      border-radius: 14px; background: #fff;
    }
    .task-check { width: 18px; height: 18px; flex: 0 0 auto; margin: 2px 0 0; accent-color: var(--green); cursor: pointer; }
    .task-main { flex: 1; min-width: 0; }
    .task-title { font-size: 14px; font-weight: 650; line-height: 1.4; }
    .task-row.is-complete .task-title { color: #849087; text-decoration: line-through; }
    .task-meta { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 5px; color: var(--muted); font-size: 12px; }
    .task-time { color: var(--muted); white-space: nowrap; font-size: 12px; }
    .subject-tag { display: inline-flex; align-items: center; gap: 5px; font-weight: 650; }
    .subject-tag i { width: 7px; height: 7px; border-radius: 50%; background: var(--tag, var(--green)); }
    .empty-state { padding: 25px 16px; border: 1px dashed #cad6ce; border-radius: 14px; color: var(--muted); text-align: center; font-size: 14px; line-height: 1.5; }
    .lower-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; margin-top: 18px; }
    .exam-list, .subject-list, .task-list, .topic-list { display: grid; gap: 10px; }
    .exam-compact { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
    .exam-compact:last-child { border-bottom: 0; padding-bottom: 0; }
    .exam-compact:first-child { padding-top: 0; }
    .exam-compact-title { font-size: 14px; font-weight: 700; }
    .exam-compact-meta { margin-top: 3px; color: var(--muted); font-size: 13px; }
    .countdown-chip, .status-chip, .type-chip {
      display: inline-flex; align-items: center; min-height: 26px; padding: 4px 9px; border-radius: 999px;
      background: var(--green-soft); color: var(--green-dark); font-size: 12px; font-weight: 700; white-space: nowrap;
    }
    .status-chip.in-progress { background: var(--amber-soft); color: var(--amber); }
    .status-chip.not-started { background: #edf0ee; color: #68756d; }
    .progress-line { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 12px 0 7px; color: var(--muted); font-size: 13px; }
    .progress-track { height: 7px; overflow: hidden; border-radius: 999px; background: #e9eeeb; }
    .progress-fill { height: 100%; border-radius: inherit; background: var(--green); }
    .subject-card { padding: 17px; }
    .subject-card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 14px; }
    .subject-card-tools { display: flex; align-items: center; justify-content: flex-end; flex-wrap: wrap; gap: 7px; }
    .subject-name-line { display: flex; align-items: center; gap: 10px; }
    .subject-color { width: 10px; height: 10px; flex: 0 0 auto; border-radius: 50%; background: var(--subject-color, var(--green)); }
    .subject-name { font-size: 16px; font-weight: 750; }
    .subject-code { margin-top: 4px; color: var(--muted); font-size: 13px; }
    .subject-exam { margin-top: 12px; color: var(--muted); font-size: 13px; }
    .topic-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); }
    .topic-row:last-child { border-bottom: 0; }
    .topic-name { font-size: 14px; font-weight: 600; line-height: 1.4; }
    .topic-actions { display: flex; align-items: center; gap: 7px; flex: 0 0 auto; }
    .topic-remove-button { display: grid; width: 28px; height: 28px; place-items: center; border: 1px solid var(--line); border-radius: 9px; background: var(--surface); color: var(--muted); font-size: 16px; line-height: 1; cursor: pointer; }
    .topic-remove-button:hover { border-color: var(--red); color: var(--red); background: var(--red-soft); }
    .task-actions { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }
    .topic-add-button { width: 100%; margin-top: 10px; }
    .topic-status-button { border: 0; cursor: pointer; }
    .topic-hint { margin-top: 13px; color: var(--muted); font-size: 13px; }
    .subject-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 15px; }
    .tasks-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 15px; }
    .filter-row { display: flex; flex-wrap: wrap; gap: 7px; }
    .filter-button { min-height: 35px; padding: 6px 11px; border: 1px solid var(--line); border-radius: 999px; background: #fff; color: var(--muted); font-size: 13px; cursor: pointer; }
    .filter-button[aria-pressed="true"] { border-color: var(--green); background: var(--green-soft); color: var(--green-dark); font-weight: 700; }
    .task-day-group { margin-bottom: 20px; }
    .task-day-title { margin-bottom: 9px; color: var(--muted); font-size: 13px; font-weight: 750; letter-spacing: .035em; text-transform: uppercase; }
    .progress-layout { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(300px, .9fr); gap: 18px; }
    .progress-summary { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .progress-card { padding: 16px; }
    .progress-number { margin-top: 7px; font-size: 25px; font-weight: 750; letter-spacing: -.04em; }
    .progress-detail { margin-top: 4px; color: var(--muted); font-size: 13px; }
    .settings-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
    .settings-card { padding: 20px; }
    .settings-card p { margin-top: 8px; color: var(--muted); font-size: 14px; line-height: 1.55; }
    .settings-actions { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 16px; }
    .demo-note { display: flex; align-items: flex-start; gap: 11px; margin-top: 18px; padding: 14px 16px; border-radius: 14px; background: #f0f5f1; color: #53645a; font-size: 13px; line-height: 1.5; }
    .demo-note strong { color: #2c5340; }
    .chat-shell { display: grid; grid-template-rows: minmax(0,1fr) auto; width: 100%; min-width: 0; max-width: 100%; height: min(68vh,720px); height: min(68dvh,720px); min-height: 360px; max-height: calc(100dvh - 220px); overflow: hidden; padding: 0; }
    .chat-feed { display: flex; flex-direction: column; align-items: stretch; gap: 14px; width: 100%; min-width: 0; min-height: 0; max-width: 100%; overflow-x: clip; overflow-y: auto; scrollbar-gutter: stable; overscroll-behavior: contain; overflow-anchor: none; padding: 22px; }
    .chat-empty { display: grid; flex: 1; place-content: center; text-align: center; padding: 28px; }
    .chat-empty-mark { display: grid; width: 46px; height: 46px; place-items: center; margin: 0 auto 12px; border-radius: 15px; background: var(--green-soft); color: var(--green-dark); font-size: 22px; }
    .chat-empty h2 { margin: 0; font-size: 18px; }
    .chat-empty p { max-width: 440px; margin: 7px auto 0; color: var(--muted); font-size: 14px; line-height: 1.5; }
    .chat-message { box-sizing: border-box; width: fit-content; max-width: min(84%,720px); min-width: 0; padding: 13px 15px; border: 1px solid var(--line); border-radius: 17px; background: var(--surface-soft); white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.55; }
    .chat-message.user { align-self: flex-end; border-color: transparent; border-bottom-right-radius: 5px; background: var(--green); color: white; }
    .chat-message.assistant { align-self: flex-start; border-bottom-left-radius: 5px; }
    .chat-message-label { margin-bottom: 5px; color: var(--muted); font-size: 11px; font-weight: 750; letter-spacing: .06em; text-transform: uppercase; }
    .chat-message.user .chat-message-label { color: rgba(255,255,255,.78); }
    .chat-error { color: var(--red); }
    .chat-pending { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
    .chat-pending-title { margin: 0 0 8px; font-size: 13px; font-weight: 750; }
    .chat-proposal-list { display: grid; gap: 6px; margin: 0 0 10px; padding-left: 18px; color: var(--muted); font-size: 13px; }
    .chat-pending-actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .chat-compose { width: 100%; min-width: 0; max-width: 100%; padding: 16px 20px; border-top: 1px solid var(--line); background: var(--surface); }
    .chat-compose-row { display: flex; align-items: flex-end; gap: 10px; }
    .chat-compose-row textarea { box-sizing: border-box; flex: 1; min-width: 0; min-height: 50px; max-height: 150px; resize: vertical; padding: 12px 13px; border: 1px solid var(--line); border-radius: 13px; background: var(--surface-soft); color: var(--ink); font: inherit; line-height: 1.45; }
    .chat-compose-row .button { width: 88px; min-width: 88px; min-height: 48px; flex: 0 0 88px; }
    .chat-compose-note { display: flex; justify-content: space-between; gap: 10px; margin-top: 9px; color: var(--muted); font-size: 11px; line-height: 1.4; }
    .chat-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
    .chat-api-status { color: var(--muted); font-size: 12px; }
    :root[data-theme="dark"] .chat-compose-row textarea { background: #15211b; }
    :root[data-theme="dark"] .chat-message.assistant { background: var(--surface-soft); }
    .site-footer { display: flex; justify-content: space-between; gap: 14px; padding: 0 clamp(22px, 4vw, 54px) 22px; color: var(--muted); font-size: 12px; }
    .modal-backdrop { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 20px; background: rgba(18, 31, 24, .42); }
    .modal { width: min(100%, 520px); max-height: min(90vh, 760px); overflow: auto; padding: 23px; border: 1px solid var(--line); border-radius: 20px; background: #fff; box-shadow: 0 24px 70px rgba(18,31,24,.24); }
    .modal-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 14px; margin-bottom: 17px; }
    .modal-copy { margin-top: 6px; color: var(--muted); font-size: 14px; line-height: 1.45; }
    .icon-button { display: grid; width: 38px; height: 38px; place-items: center; border: 1px solid var(--line); border-radius: 11px; background: #fff; font-size: 19px; cursor: pointer; }
    .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    .field { display: grid; gap: 6px; min-width: 0; }
    .field-full { grid-column: 1 / -1; }
    .field label { font-size: 14px; font-weight: 650; }
    .field input, .field select, .field textarea {
      width: 100%; min-height: 43px; padding: 9px 11px; border: 1px solid #cfd9d2; border-radius: 10px;
      background: #fff; color: var(--ink); font-size: 15px;
    }
    .field textarea { min-height: 112px; resize: vertical; line-height: 1.5; }
    .field-help { color: var(--muted); font-size: 12px; line-height: 1.4; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 9px; margin-top: 19px; }
    .toast {
      position: fixed; right: 22px; bottom: 22px; z-index: 40; max-width: min(400px, calc(100vw - 44px));
      padding: 13px 16px; border-radius: 12px; background: #193e2d; color: #fff; box-shadow: var(--shadow);
      font-size: 14px; line-height: 1.45;
    }
    .hidden { display: none !important; }
    .onboarding-shell {
      min-height: 100vh; display: grid; place-items: center; padding: 30px;
      background: radial-gradient(ellipse at top left, #e6f1ea 0, #f4f7f5 47%, #edf3ef 100%);
    }
    .onboarding-card {
      display: grid; grid-template-columns: minmax(280px, .82fr) minmax(420px, 1.18fr);
      width: min(100%, 1040px); overflow: hidden; border: 1px solid var(--line);
      border-radius: 26px; background: var(--surface); box-shadow: 0 24px 70px rgba(29,57,43,.12);
    }
    .onboarding-aside {
      display: flex; flex-direction: column; justify-content: space-between; min-height: 620px;
      padding: 36px; background: var(--green); color: #fff;
    }

          { id: "demo-3", title: "Practice 10 integration problems", subjectId: "mathematics", date: today, time: "17:00", duration: 50, type: "Practice", completed: false, generated: false },

          { id: "demo-5", title: "Make a one-page chapter summary", subjectId: "chemistry", date: dayOffset(2), time: "16:30", duration: 30, type: "Notes", completed: false, generated: false },

      function loadState() {

      var chatLoading = false;

      function esc(value) {

          var changed = new Date(parts[0], parts[1] - 1 + (name === "month-next" ? 1 : -1), 1, 12);
          state.viewMonth = localISO(changed).slice(0, 7);
          state.selectedDate = localISO(changed);
          saveState(); render();
        }
        else if (name === "close-modal") closeModal();
        else if (name === "backdrop" && event.target === action) closeModal();
        else if (name === "export") exportBackup();
        else if (name === "import") document.getElementById("import-file").click();
        else if (name === "reset") resetDemo();
      });
      document.addEventListener("submit", function (event) {
        if (event.target.id === "chat-form") { event.preventDefault(); sendGeminiChat(); }
      });
      document.addEventListener("change", function (event) {
        var check = event.target.closest("[data-task-check]");
        if (check) {
          var task = state.tasks.find(function (item) { return item.id === check.dataset.taskCheck; });
          if (task) {
            task.completed = check.checked;
            if (check.checked) cancelNativeReminder(task.id); else scheduleNativeReminder(task);
            saveState(); render();
          }
          return;
        }
        if (event.target.id === "import-file") importBackup(event.target.files && event.target.files[0]);
      });
      document.addEventListener("keydown", function (event) {
        if (event.key === "Enter" && event.target.id === "chat-input" && !event.shiftKey) {
          event.preventDefault();
          var chatForm = document.getElementById("chat-form");
          if (chatForm && chatForm.requestSubmit) chatForm.requestSubmit();
        }
        if (event.key === "Escape") closeModal();
      });
      render();
      saveState();
    })();
  </script>
</body>
</html>
